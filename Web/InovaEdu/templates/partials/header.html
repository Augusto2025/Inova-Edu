{% load static %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<header class="navbar">

    <!-- Ondas Tecnológicas Senoidais -->
    <div class="ondas-container">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="onda onda-1">
            <path d="M0,192 C280,256 560,128 840,160 C1120,192 1260,288 1440,224 L1440,320 L0,320 Z" fill="none" stroke="rgba(255, 255, 255, 0.86)" stroke-width="2" stroke-dasharray="5, 5"></path>
        </svg>
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="onda onda-2">
            <path d="M0,128 C360,224 720,96 1080,192 C1260,240 1380,160 1440,128 L1440,320 L0,320 Z" fill="none" stroke="rgba(255, 146, 3, 0.67)" stroke-width="1.5"></path>
        </svg>
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="onda onda-3">
            <path d="M0,224 C400,128 800,256 1200,160 C1320,128 1400,192 1440,224 L1440,320 L0,320 Z" fill="none" stroke="rgba(220, 220, 220, 0.86)" stroke-width="3"></path>
        </svg>
    </div>

    <!-- LOGO -->
    <div class="logo">
        <a href="{% url 'home' %}">
            <img src="{% static 'img/Logo_branco_icone.png' %}" alt="Logo">
        </a>
    </div>

    <!-- MENU MOBILE -->
    <button id="menuToggle" class="hamburger" aria-label="Abrir menu">
        ☰
    </button>

    <!-- MENU -->
    <nav id="site-nav" class="menu">

        <a href="{% url 'home' %}"
           class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            Home
        </a>

        <a href="{% url 'cursos' %}"
           class="{% if request.resolver_match.url_name == 'cursos' %}active{% endif %}">
            Cursos
        </a>

        <a href="{% url 'forum_blocos' %}"
           class="{% if request.resolver_match.url_name == 'forum_blocos' %}active{% endif %}">
            Fórum
        </a>

        <a href="{% url 'calendario' %}"
           class="{% if request.resolver_match.url_name == 'calendario' %}active{% endif %}">
            Eventos
        </a>

        <a href="{% url 'perfil' %}"
           class="{% if request.resolver_match.url_name == 'perfil' %}active{% endif %}">
            Perfil
        </a>

    </nav>

    <!-- USUÁRIO -->
    <div class="user">

        <a href="{% url 'perfil' %}" class="user-name">
            Olá, {{ usuario.nome }}
        </a>

       <a href="{% url 'login' %}" class="logout" title="Sair">
          <span class="material-symbols-outlined">logout</span>
        </a>

    </div>

</header>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const btn = document.getElementById('menuToggle');
    const navbar = document.querySelector('.navbar');

    if(btn){
        btn.addEventListener('click', () => {
            navbar.classList.toggle('nav-open');
        });
    }

    window.addEventListener('resize', () => {
        if(window.innerWidth > 768){
            navbar.classList.remove('nav-open');
        }
    });

});
</script>
